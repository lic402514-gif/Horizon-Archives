{% extends "admin/base.html" %}
{% block title %}仪表盘{% endblock %}
{% block main %}
<div class="page-header"><h1>📊 仪表盘</h1></div>
<div class="stats-grid" id="stats-grid">加载中...</div>
<div class="card">
    <h3>最近下载</h3>
    <table id="recent-downloads"><tbody><tr><td>加载中...</td></tr></tbody></table>
</div>
<script>
async function loadDashboard() {
    try {
        const [books, users, stats, pvStats] = await Promise.all([
            api('/books'), api('/users'),
            api('/stats/summary').catch(() => null),
            api('/stats/page-views').catch(() => null)
        ]);
        const published = books.filter(b => b.status === 'published').length;
        const html = [
            {label:'图书总数', value: books.length, color: '#2563eb'},
            {label:'已发布', value: published, color: '#16a34a'},
            {label:'草稿', value: books.length - published, color: '#f59e0b'},
            {label:'用户数', value: users.length, color: '#8b5cf6'},
        ];
        if (stats) {
            html.push({label:'今日下载', value: stats.today_downloads||0, color: '#ec4899'});
            html.push({label:'总下载', value: stats.total_downloads||0, color: '#06b6d4'});
        }
        if (pvStats) {
            var todayIps = pvStats.today_ips||0;
            var yesterdayIps = pvStats.yesterday_ips||0;
            var diff = todayIps - yesterdayIps;
            var diffHtml = '';
            if (diff > 0) diffHtml = ' <span style="font-size:0.85rem;color:#16a34a;">(+' + diff + ')</span>';
            else if (diff < 0) diffHtml = ' <span style="font-size:0.85rem;color:#dc2626;">(' + diff + ')</span>';
            else diffHtml = ' <span style="font-size:0.85rem;color:var(--muted);">(-)</span>';

            html.push(
                {label:'今日访问人数', value: todayIps + diffHtml, color: '#f97316', useHtml: true},
                {label:'昨日访问人数', value: yesterdayIps, color: '#a78bfa'},
                {label:'总访问人数', value: pvStats.total_ips||0, color: '#84cc16'},
                {label:'总浏览', value: pvStats.total_views||0, color: '#14b8a6'},
            );
        }
        document.getElementById('stats-grid').innerHTML = html.map(s => {
            var valHtml = s.useHtml ? s.value : s.value;
            return `<div class="card"><h3>${s.label}</h3><div class="value" style="color:${s.color}">${valHtml}</div></div>`;
        }).join('');

        if (stats && stats.recent_logs) {
            document.getElementById('recent-downloads').innerHTML = `
                <thead><tr><th>用户</th><th>书籍</th><th>格式</th><th>时间</th></tr></thead>
                <tbody>${stats.recent_logs.slice(0,10).map(l =>
                    `<tr><td>${l.username||'-'}</td><td>${l.book_title||'-'}</td><td>${l.format||'-'}</td><td>${l.timestamp||'-'}</td></tr>`
                ).join('')}</tbody>`;
        }
    } catch (e) {
        document.getElementById('stats-grid').innerHTML =
            `<div class="card" style="color:var(--danger)">⚠️ ${e.message} <button class="btn btn-outline btn-sm" onclick="loadDashboard()">重试</button></div>`;
    }
}
loadDashboard();
</script>
{% endblock %}
