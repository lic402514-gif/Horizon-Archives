<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>管理员登录 — 地平线档案馆（Horizon Archive）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f5f4;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;border:1px solid #e7e5e4;border-radius:12px;padding:2.5rem;width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.box h1{font-size:1.5rem;margin-bottom:0.25rem;text-align:center}
.box p{color:#78716c;text-align:center;margin-bottom:2rem;font-size:0.9rem}
.fg{margin-bottom:1rem}.fg label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.3rem;color:#78716c}
.fg input{width:100%;padding:0.6rem 0.75rem;border:1px solid #e7e5e4;border-radius:6px;font-size:0.95rem}
.btn{width:100%;padding:0.65rem;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:0.95rem;font-weight:600;cursor:pointer}.btn:hover{background:#1d4ed8}
.err{color:#dc2626;font-size:0.85rem;margin-bottom:1rem;text-align:center;display:none}.err.active{display:block}
</style></head>
<body>
<div class="box"><h1>📚 管理后台</h1><p>地平线档案馆（Horizon Archive）资源小站</p>
<div class="err" id="error"></div>
<form onsubmit="doLogin(event)">
    <div class="fg"><label>用户名</label><input type="text" id="username" required autofocus></div>
    <div class="fg"><label>密码</label><input type="password" id="password" required></div>
    <button type="submit" class="btn">登 录</button>
</form></div>
<script>
async function doLogin(e){e.preventDefault();
    var err=document.getElementById('error');
    try{
        var r=await fetch('/api/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
        if(!r.ok){var d=await r.json();throw new Error(d.detail||'Login failed')}
        location.href='/admin';
    }catch(ex){err.textContent=ex.message;err.classList.add('active')}
}
</script>
</body>
</html>
