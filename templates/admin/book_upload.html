{% extends "admin/base.html" %}
{% block title %}图书资源上传{% endblock %}
{% block main %}
<style>
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.book-picker{padding:0;max-height:600px;display:flex;flex-direction:column}
.book-picker .search-box{padding:1rem 1rem 0}
.book-picker .search-box input{width:100%;padding:0.55rem 0.75rem;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;outline:none}
.book-picker .search-box input:focus{border-color:#a5d6a7}
.book-picker .search-results{flex:1;overflow-y:auto;padding:0.5rem 1rem 1rem}
.book-option{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.8rem;cursor:pointer;border-radius:8px;transition:0.15s;border:2px solid transparent}
.book-option:hover{background:#f4faf5}
.book-option.selected{border-color:#43a047;background:#e8f5e9}
.book-option .info{flex:1;min-width:0}
.book-option .title{font-weight:600;color:#1b5e20;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-option .sub{font-size:0.75rem;color:#8d9f8d}
.book-option .cat-code{font-size:0.7rem;font-weight:800;color:#43a047;background:#f0faf3;padding:2px 6px;border-radius:4px;flex-shrink:0;margin-left:0.5rem}
.selected-indicator{display:none;color:#43a047;font-weight:700;font-size:1.1rem;margin-left:0.5rem}
.book-option.selected .selected-indicator{display:inline}
.no-results{padding:2rem;text-align:center;color:var(--muted)}
.upload-section{padding:1rem}
.section-label{font-size:0.8rem;font-weight:600;color:#4c8b5b;margin-bottom:0.5rem}
#selected-book-name{margin-top:0.5rem;font-size:0.85rem}
#selected-book-name strong{color:#1b5e20}
</style>

<div class="page-header"><h1>📖 图书资源上传</h1></div>

<div class="upload-grid">
    <!-- Left: Book Selector -->
    <div class="card book-picker">
        <div class="search-box">
            <input type="text" id="search-title" placeholder="🔍 按书名检索..." oninput="searchBooks()" autocomplete="off">
            <input type="text" id="search-cat" placeholder="📂 按分类号检索 (如 A81)..." oninput="searchBooks()" style="margin-top:0.5rem" autocomplete="off">
        </div>
        <div class="search-results" id="search-results">
            <div class="no-results">输入书名或分类号开始检索</div>
        </div>
        <input type="hidden" id="selected-book-id">
    </div>

    <!-- Right: Asset Uploads -->
    <div class="card upload-section">
        <h3>资源上传</h3>
        <div id="selected-book-name" style="margin-bottom:1rem"></div>
        <div class="form-group"><label>📔 封面图片</label>
            <input type="file" id="cover-file" accept="image/*" onchange="previewCover(this)">
            <img id="cover-preview" style="max-width:200px;max-height:280px;margin-top:0.5rem;display:none;border-radius:8px">
        </div>
        <div class="form-group"><label>📘 电子书文件</label>
            <input type="file" id="ebook-file" accept=".pdf,.epub,.mobi,.azw3,.djvu,.txt" onchange="showFileName(this)">
            <div id="ebook-name" style="font-size:0.8rem;color:var(--muted);margin-top:0.25rem"></div>
        </div>
        <div class="form-group"><label>格式标签</label>
            <select id="format-select" onchange="customFormat(this.value)">
                <option value="PDF">PDF</option><option value="EPUB">EPUB</option><option value="MOBI">MOBI</option>
                <option value="AZW3">AZW3</option><option value="DJVU">DJVU</option><option value="TXT">TXT</option>
                <option value="__custom__">自定义...</option>
            </select>
            <input type="text" id="format-custom" placeholder="输入自定义格式" style="display:none;margin-top:0.5rem;width:100%">
        </div>
        <button class="btn btn-primary" style="margin-top:1rem;width:100%" onclick="doUpload()">🚀 上传并关联</button>
        <div id="upload-status" style="margin-top:0.5rem;font-size:0.85rem;color:var(--muted)"></div>
    </div>
</div>

<script>
let allBooks=[],selectedBookId=null;

async function loadAllBooks(){
    allBooks=(await api('books/datagrid?page_size=500')).rows||[];
    searchBooks();
}

function searchBooks(){
    var q=(document.getElementById('search-title').value||'').toLowerCase();
    var cat=(document.getElementById('search-cat').value||'').toUpperCase();
    var filtered=allBooks.filter(function(b){
        var tq=!q||(b.title||'').toLowerCase().includes(q);
        var tc=!cat||(b.category_code||'').toUpperCase().startsWith(cat);
        return tq&&tc;
    }).slice(0,30);
    var h='';
    filtered.forEach(function(b){
        h+='<div class="book-option'+(selectedBookId===b.id?' selected':'')+'" onclick="selectBook('+b.id+',\''+(b.title||'').replace(/\'/g,'\\\'')+'\')">'+
            '<div class=info><div class=title>'+b.title+'</div><div class=sub>'+(b.author_name||'')+' · '+(b.publisher_name||'')+' · '+(b.pub_year||'')+' · '+((b.files||[]).length||0)+'个文件</div></div>'+
            '<div class=cat-code>'+b.category_code+'</div>'+
            '<span class=selected-indicator>✓</span></div>';
    });
    document.getElementById('search-results').innerHTML=h||'<div class=no-results>无匹配结果</div>';
}

function selectBook(id,title){
    selectedBookId=id;document.getElementById('selected-book-id').value=id;
    document.getElementById('selected-book-name').innerHTML='已选择: <strong>'+title+'</strong>';
    searchBooks();
}

function showFileName(input){
    document.getElementById('ebook-name').textContent=input.files[0]?input.files[0].name:'';
}
function previewCover(input){
    var p=document.getElementById('cover-preview');
    if(input.files[0]){p.src=URL.createObjectURL(input.files[0]);p.style.display='block'}
}
function customFormat(v){
    var c=document.getElementById('format-custom');
    c.style.display=v==='__custom__'?'block':'none';
    if(v!=='__custom__'){c.value=''}
}

async function doUpload(){
    if(!selectedBookId){toast('请先选择一本图书','error');return}
    var ebookFile=document.getElementById('ebook-file').files[0];
    if(!ebookFile){toast('请选择文件','error');return}
    var format=document.getElementById('format-select').value;
    if(format==='__custom__')format=document.getElementById('format-custom').value.trim();
    if(!format)format=(ebookFile.name.split('.').pop()||'pdf').toUpperCase();

    toast('正在获取OSS上传凭证...');
    var sts=await api('oss/sts');
    var key='books/'+selectedBookId+'/'+new Date().toISOString().replace(/[:.]/g,'-')+'_'+ebookFile.name;

    toast('正在直传OSS: '+ebookFile.name+' (不经过服务器)...');
    var fd=new FormData();
    fd.append('key',key);
    fd.append('policy',sts.policy);
    fd.append('Signature',sts.signature);
    fd.append('OSSAccessKeyId',sts.access_key_id);
    fd.append('success_action_status','200');
    fd.append('file',ebookFile);

    var resp=await fetch('https://'+sts.bucket+'.'+sts.endpoint,{method:'POST',body:fd,mode:'no-cors'});
    toast('OSS上传成功 · 正在登记...');

    var asset=await api('assets/register',{method:'POST',body:{
        filename:ebookFile.name, object_key:key, size:ebookFile.size,
        mime_type:ebookFile.type, asset_type:'ebook', bucket:sts.bucket
    }});
    await api('books/'+selectedBookId+'/assets',{method:'POST',body:{asset_id:asset.id,role:'ebook',format:format}});

    var coverFile=document.getElementById('cover-file').files[0];
    if(coverFile){
        var key2='books/'+selectedBookId+'/cover_'+Date.now()+'_'+coverFile.name;
        var fdc=new FormData();
        fdc.append('key',key2);fdc.append('policy',sts.policy);
        fdc.append('Signature',sts.signature);fdc.append('OSSAccessKeyId',sts.access_key_id);
        fdc.append('success_action_status','200');fdc.append('file',coverFile);
        await fetch('https://'+sts.bucket+'.'+sts.endpoint,{method:'POST',body:fdc});
        var ca=await api('assets/register',{method:'POST',body:{
            filename:coverFile.name, object_key:key2, size:coverFile.size,
            mime_type:coverFile.type, asset_type:'book_cover', bucket:sts.bucket
        }});
        await api('books/'+selectedBookId+'/assets',{method:'POST',body:{asset_id:ca.id,role:'cover'}});
    }
    toast('关联成功 · 正在更新页面...');
    await api('rebuild-ssg',{method:'POST'});
    toast('下载链接已更新');
    document.getElementById('ebook-file').value='';document.getElementById('cover-file').value='';
    document.getElementById('ebook-name').textContent='';loadAllBooks();
}

loadAllBooks();
</script>
{% endblock %}
