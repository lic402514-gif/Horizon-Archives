<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的书架 — 地平线档案馆</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.bookshelves-wrap { max-width: 800px; margin: 0 auto; padding: 20px; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-header h2 { font-size: 20px; color: #1b5e20; }
.btn-add { background: #43a047; color: #fff; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 13px; }
.btn-add:hover { background: #2e7d32; }
.shelf-row { background: #fff; border: 1px solid #dcebdc; border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: all .2s; }
.shelf-row:hover { border-color: #a5d6a7; box-shadow: 0 2px 8px rgba(46,125,50,0.06); }
.shelf-info h4 { font-size: 15px; color: #2e5e32; margin: 0 0 4px 0; }
.shelf-info .meta { font-size: 12px; color: #8d9f8d; }
.shelf-info a { color: #2e5e32; text-decoration: none; }
.shelf-actions { display: flex; gap: 6px; }
.shelf-actions button { background: none; border: 1px solid #dcebdc; padding: 4px 12px; border-radius: 14px; cursor: pointer; font-size: 12px; color: #6b7d6b; }
.shelf-actions button:hover { border-color: #a5d6a7; color: #2e7d32; }
.shelf-actions .del:hover { border-color: #c62828; color: #c62828; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 14px; padding: 24px; width: 380px; max-width: 90vw; }
.modal h3 { font-size: 16px; color: #1b5e20; margin-bottom: 12px; }
.modal input { width: 100%; padding: 8px 12px; border: 1px solid #dcebdc; border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
.modal .chk-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 13px; color: #6b7d6b; }
.modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
.empty-state { text-align: center; padding: 60px 20px; color: #8d9f8d; }
</style>
</head>
<body>
<div class="bookshelves-wrap">
  <div class="page-header">
    <h2>我的书架</h2>
    <button class="btn-add" onclick="showAddModal()">+ 新建书架</button>
  </div>
  <div id="shelfList"></div>
  <div class="empty-state" id="emptyState" style="display:none">还没有书架，点击上方按钮创建一个吧</div>
  <div style="text-align:center;margin-top:20px"><a href="/" style="color:#43a047;text-decoration:none;font-size:13px">← 返回首页</a></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">新建书架</h3>
    <input id="modalName" placeholder="书架名称">
    <div class="chk-row"><input type="checkbox" id="modalPublic" checked><label>公开书架（其他人可见）</label></div>
    <div class="btn-row">
      <button onclick="closeModal()" style="border:1px solid #dcebdc;background:#fff;padding:6px 14px;border-radius:14px;cursor:pointer">取消</button>
      <button onclick="saveShelf()" style="background:#43a047;color:#fff;border:none;padding:6px 14px;border-radius:14px;cursor:pointer">保存</button>
    </div>
  </div>
</div>

<script>
var editId = null;
function load() {
  fetch('/api/bookshelves', {credentials:'same-origin'}).then(r => {
    if (!r.ok) { window.location.href = '/login?redirect=/user/bookshelves'; return; }
    return r.json();
  }).then(shelves => {
    if (!shelves) return;
    if (shelves.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      return;
    }
    var html = '';
    shelves.forEach(function(s) {
      html += '<div class="shelf-row"><div class="shelf-info"><a href="/user/bookshelf/' + s.id + '"><h4>' + s.name + '</h4></a><div class="meta">' + (s.book_count||0) + ' 本书 · ' + (s.is_public ? '公开' : '私密') + '</div></div><div class="shelf-actions"><button onclick="editShelf(' + s.id + ',\'' + s.name + '\',' + s.is_public + ')">编辑</button><button class="del" onclick="deleteShelf(' + s.id + ')">删除</button></div></div>';
    });
    document.getElementById('shelfList').innerHTML = html;
  });
}

function showAddModal() { editId = null; document.getElementById('modalTitle').textContent = '新建书架'; document.getElementById('modalName').value = ''; document.getElementById('modalPublic').checked = true; document.getElementById('modal').classList.add('show'); }
function editShelf(id, name, pub) { editId = id; document.getElementById('modalTitle').textContent = '编辑书架'; document.getElementById('modalName').value = name; document.getElementById('modalPublic').checked = pub; document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function saveShelf() {
  var name = document.getElementById('modalName').value.trim();
  if (!name) return;
  var isPublic = document.getElementById('modalPublic').checked;
  var opts = { method: editId ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name:name, is_public:isPublic}) };
  var url = editId ? '/api/bookshelves/' + editId : '/api/bookshelves';
  fetch(url, opts).then(r => r.json()).then(() => { closeModal(); load(); });
}

function deleteShelf(id) {
  if (!confirm('确定删除此书架？书架中的书籍不会被删除。')) return;
  fetch('/api/bookshelves/' + id, {method:'DELETE'}).then(() => load());
}

load();
</script>
<script src="/static/theme-dawn-v2.js"></script>
</body>
</html>
