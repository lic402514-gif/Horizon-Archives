<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书架详情 — 地平线档案馆</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.detail-wrap { max-width: 800px; margin: 0 auto; padding: 20px; }
.shelf-header { margin-bottom: 20px; }
.shelf-header h2 { font-size: 20px; color: #1b5e20; margin-bottom: 4px; }
.shelf-header .meta { font-size: 13px; color: #8d9f8d; }
.book-row { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid #dcebdc; border-radius: 10px; padding: 14px 18px; margin-bottom: 8px; transition: all .2s; }
.book-row:hover { border-color: #a5d6a7; box-shadow: 0 2px 8px rgba(46,125,50,0.05); }
.book-cover-sm { width: 48px; height: 64px; border-radius: 6px; background: linear-gradient(135deg, #e8f5e9, #a5d6a7); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.book-info { flex: 1; }
.book-info h4 { font-size: 15px; color: #2e5e32; margin-bottom: 2px; }
.book-info h4 a { color: #2e5e32; text-decoration: none; }
.book-info .bmeta { font-size: 12px; color: #8d9f8d; }
.book-actions button { background: none; border: 1px solid #dcebdc; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 11px; color: #c62828; }
.book-actions button:hover { border-color: #c62828; }
.empty-state { text-align: center; padding: 60px 20px; color: #8d9f8d; }
</style>
</head>
<body>
<div class="detail-wrap">
  <div class="shelf-header">
    <h2 id="shelfName"></h2>
    <div class="meta" id="shelfMeta"></div>
  </div>
  <div id="bookList"></div>
  <div class="empty-state" id="emptyState" style="display:none">这个书架还是空的</div>
  <div style="text-align:center;margin-top:20px"><a href="javascript:history.back()" style="color:#43a047;text-decoration:none;font-size:13px">← 返回</a></div>
</div>

<script>
(function() {
  var path = window.location.pathname;
  var sid = path.split('/').filter(Boolean).pop();
  if (!sid) return;

  fetch('/api/bookshelves/' + sid).then(r => r.json()).then(function(shelf) {
    document.getElementById('shelfName').textContent = shelf.name;
    document.getElementById('shelfMeta').textContent = (shelf.book_count||0) + ' 本书 · ' + (shelf.is_public ? '公开' : '私密');
    if (!shelf.items || shelf.items.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      return;
    }
    var html = '';
    shelf.items.forEach(function(b) {
      html += '<div class="book-row"><div class="book-cover-sm">📖</div><div class="book-info"><h4><a href="/book/' + b.id + '.html">' + b.title + '</a></h4><div class="bmeta">' + (b.author ? b.author.name : '') + (b.pub_year ? ' · ' + b.pub_year : '') + '</div></div><div class="book-actions"><button onclick="removeBook(' + sid + ',' + b.id + ')">移除</button></div></div>';
    });
    document.getElementById('bookList').innerHTML = html;
    document.getElementById('emptyState').style.display = 'none';
  }).catch(function() { document.getElementById('shelfName').textContent = '加载失败'; });
})();

function removeBook(sid, bid) {
  fetch('/api/bookshelves/' + sid + '/items/' + bid, {method:'DELETE'}).then(function() { location.reload(); });
}
</script>
<script src="/static/theme-dawn-v2.js"></script>
</body>
</html>
