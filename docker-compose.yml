version: "3.8"

services:
  web:
    build: .
    image: personal-library:latest
    container_name: library-api
    environment:
      - DATABASE_URL=sqlite:///./data/library.db
      - STORAGE_DIR=./data/files
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
    volumes:
      - library_data:/app/data
      - ./dist:/app/dist
      - ./static:/app/static
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: library-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/var/www/html:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  library_data:
